name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: read-only unless a job opts in.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (race detector, real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: frontdir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      FRONTDIR_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/frontdir_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch release: go.mod states the minimum language
          # version, but CI and scans must use a toolchain with security fixes.
          go-version: '1.26.x'
          check-latest: true
      - run: go mod verify
      - run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  browser-interop:
    name: Browser/Go E2EE interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch release: go.mod states the minimum language
          # version, but CI and scans must use a toolchain with security fixes.
          go-version: '1.26.x'
          check-latest: true
      - name: Install Playwright and Chromium
        run: |
          npm install --global --ignore-scripts playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Go and WebCrypto implementations agree byte-for-byte
        run: FRONTDIR_BROWSER_TEST=1 NODE_PATH="$(npm root -g)" go test -count=1 -run TestBrowserInterop -v ./internal/e2ee/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch release: go.mod states the minimum language
          # version, but CI and scans must use a toolchain with security fixes.
          go-version: '1.26.x'
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # "Trojan Source": invisible bidirectional characters make code read
      # differently to reviewers than to compilers. Write them as escapes.
      - name: No hidden bidirectional characters
        run: |
          git ls-files -z -- '*.go' '*.js' '*.mjs' '*.html' '*.css' '*.md' '*.json' '*.yaml' '*.yml' '*.sql' '*.sh' |
            xargs -0 perl -CSD -ne 'if (/[\x{202A}-\x{202E}\x{2066}-\x{2069}]/) { print "$ARGV:$.: hidden bidirectional character\n"; $bad = 1 } close ARGV if eof; END { exit($bad ? 1 : 0) }'
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch release: go.mod states the minimum language
          # version, but CI and scans must use a toolchain with security fixes.
          go-version: '1.26.x'
          check-latest: true
      # Reachability-aware: fails on vulnerabilities our code can actually reach,
      # except reviewed, expiring exceptions in .github/govulncheck-exceptions.json.
      # The gate fails closed if govulncheck errors or its output is unrecognized.
      - name: govulncheck
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json ./... > govulncheck.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then echo "govulncheck failed (exit $status)"; exit "$status"; fi
          go run ./tools/vulngate -exceptions .github/govulncheck-exceptions.json < govulncheck.json
      - name: gosec
        if: success() || failure() # report both scanners' findings in one run
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude-dir=internal/testutil ./...

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg VERSION=${{ github.sha }} -t frontdir:ci .
      - name: Smoke test (non-root, read-only root filesystem)
        run: |
          test "$(docker inspect -f '{{.Config.User}}' frontdir:ci)" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL frontdir:ci version
      - name: Trivy image scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed frontdir:ci

  # Brings up the real Docker Compose stack the way docs/ADMIN_GUIDE.md §3
  # describes (secrets script, PostgreSQL, FrontDir, Caddy), then exercises
  # settings, operator commands and the documented backup/restore commands.
  compose:
    name: Docker Compose stack (end to end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create secrets
        run: sudo ../../scripts/init-secrets.sh
      - name: compose.yaml is valid with the example settings
        run: docker compose --env-file .env.example config --quiet
      - name: Configure a throwaway instance
        run: |
          cat > .env <<'EOF'
          FRONTDIR_HOST=localhost
          OIDC_ISSUER=https://idp.example.invalid
          OIDC_CLIENT_ID=frontdir
          ALLOWED_GROUPS=frontdir-users
          ADMIN_GROUPS=frontdir-admins
          TEAM_CREATION=false
          MAX_VERSIONS=5
          LOG_LEVEL=debug
          EOF
          docker compose config --quiet
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Reachable through Caddy over HTTPS, hardened
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/readyz || true)
            [ "$code" = 204 ] && break
            sleep 2
          done
          test "$code" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          curl -sk https://localhost/api/v1/auth/methods | grep -q '"oidc":true'
          curl -skI https://localhost/ | grep -qi '^content-security-policy:.*trusted-types'
          if curl -skI -H 'Accept-Encoding: gzip, br, zstd' https://localhost/app.js | grep -qi '^content-encoding:'; then
            echo "responses must not be compressed (BREACH)"; exit 1
          fi
      - name: Settings from .env reach the server; secrets stay files
        run: |
          env=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$(docker compose ps -q frontdir)")
          echo "$env" | grep -qx 'FRONTDIR_TEAM_CREATION=false'
          echo "$env" | grep -qx 'FRONTDIR_MAX_VERSIONS=5'
          echo "$env" | grep -qx 'FRONTDIR_LOG_LEVEL=debug'
          if echo "$env" | grep -q '^FRONTDIR_DATABASE_URL='; then
            echo "the database URL must only be passed as a file"; exit 1
          fi
      - name: Operator commands run in the container
        run: |
          docker compose exec -T frontdir /frontdir verify-storage --hash
          docker compose exec -T frontdir /frontdir revoke-sessions --all
      - name: Web settings commands; settings from .env are locked, the rest default
        run: |
          docker compose exec -T frontdir /frontdir settings show | tee "$RUNNER_TEMP/settings.txt"
          grep -Eq '^OIDC_ISSUER +server +https://idp.example.invalid' "$RUNNER_TEMP/settings.txt"
          grep -Eq '^MAX_VERSIONS +server +5' "$RUNNER_TEMP/settings.txt"
          grep -Eq '^DEFAULT_QUOTA +default ' "$RUNNER_TEMP/settings.txt"
          docker compose exec -T frontdir /frontdir settings reset storage
      - name: Documented backup and restore commands work (DISASTER_RECOVERY.md)
        run: |
          docker compose exec -T postgres pg_dump -U frontdir -d frontdir -Fc > "$RUNNER_TEMP/frontdir-db.dump"
          test -s "$RUNNER_TEMP/frontdir-db.dump"
          docker compose stop frontdir
          docker compose exec -T postgres dropdb -U frontdir frontdir
          docker compose exec -T postgres createdb -U frontdir frontdir
          docker compose exec -T postgres pg_restore -U frontdir -d frontdir --no-owner < "$RUNNER_TEMP/frontdir-db.dump"
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T frontdir /frontdir verify-storage --hash
      - name: Without a sign-in method the server starts in setup mode
        run: |
          sed -i '/^OIDC_/d' .env
          docker compose up -d --wait --wait-timeout 180
          curl -sk https://localhost/api/v1/auth/methods | grep -q '"setup":true'
          link=$(docker compose exec -T frontdir /frontdir setup-link | grep -o 'https://localhost/setup#[A-Za-z0-9_-]*')
          token=${link#*#}
          test ${#token} -ge 40
          if docker compose logs frontdir | grep -qF "$token"; then
            echo "the setup token must never be logged"; exit 1
          fi
          curl -skf -X POST -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}" \
            https://localhost/api/v1/setup/view | grep -q '"setupMode":true'
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"token":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' https://localhost/api/v1/setup/view)" = 401
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
