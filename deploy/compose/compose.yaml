# NoddaNAS with PostgreSQL and Caddy (automatic HTTPS).
#
#   cd deploy/compose
#   cp .env.example .env        # then edit it
#   sudo ../../scripts/init-secrets.sh
#   docker compose up -d --build
#
# Files are end-to-end encrypted in users' browsers and CLIs. The server
# holds no content keys, so there is no server-side encryption key here.
#
# Hardening applied to every service: no-new-privileges, all Linux
# capabilities dropped (and only re-added where an image needs one), and
# read-only root filesystems where the image supports it. PostgreSQL is on
# an internal network with no route to the internet or the host.
name: noddanas

services:
  noddanas:
    build:
      context: ../..
    image: noddanas:local
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      NODDANAS_PUBLIC_URL: https://${NODDANAS_HOST:?set NODDANAS_HOST in .env}
      NODDANAS_DATABASE_URL_FILE: /run/secrets/database_url
      # Sign-in: OIDC and/or SAML (configure at least one in .env).
      NODDANAS_OIDC_ISSUER: ${OIDC_ISSUER:-}
      NODDANAS_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      NODDANAS_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      NODDANAS_SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-}
      NODDANAS_SAML_TRUST_EMAIL: ${SAML_TRUST_EMAIL:-false}
      NODDANAS_ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
      NODDANAS_ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      NODDANAS_ADMIN_GROUPS: ${ADMIN_GROUPS:-}
      NODDANAS_DEFAULT_QUOTA: ${DEFAULT_QUOTA:-10GiB}
      NODDANAS_DEFAULT_TEAM_QUOTA: ${DEFAULT_TEAM_QUOTA:-50GiB}
      # Optional branding (docs/THEMING.md); files live in ./branding.
      NODDANAS_BRAND_NAME: ${BRAND_NAME:-}
      NODDANAS_THEME_FILE: ${THEME_FILE:-}
      NODDANAS_BRAND_LOGO_FILE: ${BRAND_LOGO_FILE:-}
      # Only Caddy (on the frontend network) may set X-Forwarded-For.
      NODDANAS_TRUSTED_PROXIES: 172.30.0.0/24
    secrets: [database_url, oidc_client_secret]
    volumes:
      - noddanas-data:/data
      - ./branding:/etc/noddanas/branding:ro
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: noddanas
      POSTGRES_DB: noddanas
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noddanas -d noddanas"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODDANAS_HOST: ${NODDANAS_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    depends_on: [noddanas]

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true

volumes:
  noddanas-data:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
