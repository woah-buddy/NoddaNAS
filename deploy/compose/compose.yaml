# FrontDir with PostgreSQL and Caddy (automatic HTTPS).
#
#   cd deploy/compose
#   cp .env.example .env        # then edit it
#   sudo ../../scripts/init-secrets.sh
#   docker compose up -d --build
#
# Files are end-to-end encrypted in users' browsers and CLIs. The server
# holds no content keys, so there is no server-side encryption key here.
#
# Hardening applied to every service: no-new-privileges, all Linux
# capabilities dropped (and only re-added where an image needs one), and
# read-only root filesystems where the image supports it. PostgreSQL is on
# an internal network with no route to the internet or the host.
name: frontdir

services:
  frontdir:
    build:
      context: ../..
    image: frontdir:local
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      # Fixed by this setup, on purpose: the public URL is built from
      # FRONTDIR_HOST; the database URL, OIDC client secret and settings key
      # are Docker secrets (secrets/); only Caddy's network may set
      # X-Forwarded-For.
      # Also fixed by omission: FrontDir listens on :8080 behind Caddy, which
      # terminates TLS, and stores data in the frontdir-data volume at /data.
      FRONTDIR_PUBLIC_URL: https://${FRONTDIR_HOST:?set FRONTDIR_HOST in .env}
      FRONTDIR_DATABASE_URL_FILE: /run/secrets/database_url
      FRONTDIR_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      FRONTDIR_SETTINGS_KEY_FILE: /run/secrets/settings_key
      FRONTDIR_TRUSTED_PROXIES: 172.30.0.0/24

      # Every other setting comes from .env, named without the FRONTDIR_
      # prefix (see .env.example and docs/ADMIN_GUIDE.md section 7). Empty
      # means: not set here, so it can be changed in the web admin area (a
      # value set here wins and is locked there). internal/config's tests
      # fail if a setting the server reads is missing here.
      # Sign-in: OIDC and/or SAML, here or on the web (frontdir setup-link).
      FRONTDIR_OIDC_ISSUER: ${OIDC_ISSUER:-}
      FRONTDIR_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      FRONTDIR_OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      FRONTDIR_OIDC_SCOPES: ${OIDC_SCOPES:-}
      FRONTDIR_SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-}
      FRONTDIR_SAML_IDP_METADATA_FILE: ${SAML_IDP_METADATA_FILE:-}
      FRONTDIR_SAML_ENTITY_ID: ${SAML_ENTITY_ID:-}
      FRONTDIR_SAML_SP_KEY_FILE: ${SAML_SP_KEY_FILE:-}
      FRONTDIR_SAML_SP_CERT_FILE: ${SAML_SP_CERT_FILE:-}
      FRONTDIR_SAML_TRUST_EMAIL: ${SAML_TRUST_EMAIL:-}
      FRONTDIR_SAML_EMAIL_ATTRIBUTES: ${SAML_EMAIL_ATTRIBUTES:-}
      FRONTDIR_SAML_NAME_ATTRIBUTES: ${SAML_NAME_ATTRIBUTES:-}
      FRONTDIR_SAML_GROUP_ATTRIBUTES: ${SAML_GROUP_ATTRIBUTES:-}
      # Who may sign in, and who administers.
      FRONTDIR_ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
      FRONTDIR_ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      FRONTDIR_ADMIN_GROUPS: ${ADMIN_GROUPS:-}
      FRONTDIR_TEAM_CREATION: ${TEAM_CREATION:-}
      # Storage and limits.
      FRONTDIR_DEFAULT_QUOTA: ${DEFAULT_QUOTA:-}
      FRONTDIR_DEFAULT_TEAM_QUOTA: ${DEFAULT_TEAM_QUOTA:-}
      FRONTDIR_MAX_FILE_SIZE: ${MAX_FILE_SIZE:-}
      FRONTDIR_MAX_VERSIONS: ${MAX_VERSIONS:-}
      FRONTDIR_TRASH_RETENTION: ${TRASH_RETENTION:-}
      # Sharing and sessions.
      FRONTDIR_LINK_DEFAULT_TTL: ${LINK_DEFAULT_TTL:-}
      FRONTDIR_LINK_MAX_TTL: ${LINK_MAX_TTL:-}
      FRONTDIR_SESSION_IDLE: ${SESSION_IDLE:-}
      FRONTDIR_SESSION_MAX_AGE: ${SESSION_MAX_AGE:-}
      # Runtime.
      FRONTDIR_LOG_LEVEL: ${LOG_LEVEL:-}
      FRONTDIR_WEBDAV: ${WEBDAV:-}
      FRONTDIR_WORKER: ${WORKER:-}
      FRONTDIR_AUTO_MIGRATE: ${AUTO_MIGRATE:-}
      FRONTDIR_WEB_SETTINGS: ${WEB_SETTINGS:-}
      # Branding (docs/THEMING.md); files live in ./branding.
      FRONTDIR_BRAND_NAME: ${BRAND_NAME:-}
      FRONTDIR_THEME_FILE: ${THEME_FILE:-}
      FRONTDIR_BRAND_LOGO_FILE: ${BRAND_LOGO_FILE:-}
    secrets: [database_url, oidc_client_secret, settings_key]
    volumes:
      - frontdir-data:/data
      - ./branding:/etc/frontdir/branding:ro
      - ./saml:/etc/frontdir/saml:ro
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: frontdir
      POSTGRES_DB: frontdir
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdir -d frontdir"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      FRONTDIR_HOST: ${FRONTDIR_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    depends_on: [frontdir]

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true

volumes:
  frontdir-data:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  database_url:
    file: ./secrets/database_url
  postgres_password:
    file: ./secrets/postgres_password
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  settings_key:
    file: ./secrets/settings_key
