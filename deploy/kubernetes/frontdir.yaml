# FrontDir on Kubernetes: a hardened reference manifest.
#
# Prerequisites (created out-of-band, never committed):
#   kubectl -n frontdir create secret generic frontdir-secrets \
#     --from-literal=database_url='postgres://...?...sslmode=verify-full' \
#     --from-literal=oidc_client_secret='...' \
#     --from-literal=settings_key="$(openssl rand -base64 32)"
# Files are end-to-end encrypted by clients; the server holds no content keys.
# settings_key only encrypts secrets saved in the web admin area; back it up.
# Settings in the ConfigMap win over (and lock) the web admin area. Omit the
# OIDC lines to set up sign-in on the web instead:
#   kubectl -n frontdir exec deploy/frontdir -- /frontdir setup-link
# PostgreSQL: use a managed service or an operator (e.g. CloudNativePG).
# Storage: more than one replica needs a ReadWriteMany volume (NFS, CephFS,
# Longhorn RWX, ...). With ReadWriteOnce storage, keep replicas: 1.
apiVersion: v1
kind: Namespace
metadata:
  name: frontdir
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontdir
  namespace: frontdir
automountServiceAccountToken: false   # FrontDir never talks to the Kubernetes API
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontdir
  namespace: frontdir
data:
  FRONTDIR_PUBLIC_URL: https://files.example.com
  FRONTDIR_OIDC_ISSUER: https://id.example.com/realms/home
  FRONTDIR_OIDC_CLIENT_ID: frontdir
  # Or/also SAML: FRONTDIR_SAML_IDP_METADATA_URL: https://idp.example.com/metadata
  FRONTDIR_ALLOWED_GROUPS: frontdir-users
  FRONTDIR_ADMIN_GROUPS: frontdir-admins
  # Quotas, link lifetimes and branding are left to the web admin area here;
  # set them in this ConfigMap to manage (and lock) them as code instead.
  # FRONTDIR_DEFAULT_QUOTA: 10GiB
  # Branding (docs/THEMING.md): mount a ConfigMap holding theme.json and/or
  # logo.png read-only and point FRONTDIR_THEME_FILE / FRONTDIR_BRAND_LOGO_FILE
  # at it. An invalid theme stops startup with a list of problems.
  # FRONTDIR_BRAND_NAME: Acme Files
  # Pod CIDR of your ingress controller, so client IPs are logged and rate
  # limited correctly. Adjust to your cluster.
  FRONTDIR_TRUSTED_PROXIES: 10.0.0.0/8
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontdir-data
  namespace: frontdir
spec:
  accessModes: [ReadWriteOnce]   # ReadWriteMany for replicas > 1
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdir
  namespace: frontdir
spec:
  replicas: 1
  strategy:
    type: Recreate   # RollingUpdate is fine with ReadWriteMany storage
  selector:
    matchLabels: {app: frontdir}
  template:
    metadata:
      labels: {app: frontdir}
    spec:
      serviceAccountName: frontdir
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontdir
          image: ghcr.io/woah-buddy/frontdir:latest   # pin by digest in production
          args: [serve]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: frontdir}
          env:
            - {name: FRONTDIR_DATABASE_URL_FILE, value: /run/secrets/frontdir/database_url}
            - {name: FRONTDIR_OIDC_CLIENT_SECRET_FILE, value: /run/secrets/frontdir/oidc_client_secret}
            - {name: FRONTDIR_SETTINGS_KEY_FILE, value: /run/secrets/frontdir/settings_key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: secrets, mountPath: /run/secrets/frontdir, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: frontdir-data}
        - name: secrets
          secret:
            secretName: frontdir-secrets
            defaultMode: 0440   # group-readable via fsGroup; never world-readable
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontdir
  namespace: frontdir
spec:
  selector: {app: frontdir}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Default-deny, then allow only what FrontDir needs: ingress from the
# ingress controller, egress to DNS, PostgreSQL and the OIDC provider (HTTPS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontdir
  namespace: frontdir
spec:
  podSelector: {matchLabels: {app: frontdir}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8080}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 5432}]
    - ports: [{port: 443}]
